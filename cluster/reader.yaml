apiVersion: v1
kind: ServiceAccount
metadata:
  name: peeker-reader
  namespace: peeker-system
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: peeker-reader
rules:
  - apiGroups: [""]
    resources: [pods, namespaces, services, replicationcontrollers, serviceaccounts]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  - apiGroups: [apps]
    resources: [replicasets, deployments, statefulsets, daemonsets]
    verbs: [get, list]
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: [get, list]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [roles, rolebindings, clusterroles, clusterrolebindings]
    verbs: [get, list]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies, ingresses]
    verbs: [get, list]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [get, list]
  - apiGroups: [cilium.io]
    resources: [ciliumnetworkpolicies, ciliumclusterwidenetworkpolicies, ciliumendpoints]
    verbs: [get, list]
  - apiGroups: [networking.istio.io]
    resources: [virtualservices, gateways, destinationrules]
    verbs: [get, list]
  - apiGroups: [gateway.networking.k8s.io]
    resources: [httproutes, tcproutes, gateways, referencegrants]
    verbs: [get, list]
  - nonResourceURLs: [/api, /api/*, /apis, /apis/*, /version]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: peeker-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: peeker-reader
subjects:
  - kind: ServiceAccount
    name: peeker-reader
    namespace: peeker-system
