apiVersion: v1
kind: ServiceAccount
metadata:
  name: peeker-responder
  namespace: peeker-system
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: peeker-responder
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, patch]
  - apiGroups: [apps]
    resources: [deployments, statefulsets, daemonsets, replicasets]
    verbs: [get, delete]
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: [get, delete]
  - apiGroups: [cilium.io]
    resources: [ciliumnetworkpolicies]
    verbs: [create]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [rolebindings, clusterrolebindings]
    verbs: [patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: peeker-responder
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: peeker-responder
subjects:
  - kind: ServiceAccount
    name: peeker-responder
    namespace: peeker-system
